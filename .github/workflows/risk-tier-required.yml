name: "🏰 PhishFort Risk Tier Profiler (Required)"

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: risk-tier-${{ github.repository }}-${{ github.event.pull_request.number }}
  # Let an in-flight run finish its label/review reconciliation. New pending
  # events may coalesce, and the latest run re-evaluates the full PR.
  cancel-in-progress: false

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout central policy repository
        uses: actions/checkout@v4
        with:
          # Pin scripts and policy to the exact revision that defined this job.
          # This prevents workflow/script skew while a policy change rolls out.
          repository: phishfort/risk-tier-policy-gate
          ref: ${{ github.workflow_sha }}
          path: .risk-tier-policy-gate
          persist-credentials: false

      - name: Check previous classification
        id: prev
        uses: actions/github-script@v7
        with:
          script: |
            const labels = await github.paginate(github.rest.issues.listLabelsOnIssue, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              per_page: 100
            });
            const tierNames = new Set(labels.map(l => l.name));
            // Accept only the two policy-owned labels. If both somehow exist,
            // treat the previous state as HIGH until full classification repairs
            // the ambiguity.
            const prevLabel = tierNames.has('risktier:high')
              ? 'risktier:high'
              : tierNames.has('risktier:low')
              ? 'risktier:low'
              : '';
            core.setOutput('label', prevLabel);
            core.info(`Previous: ${prevLabel || '(none)'}, action: ${context.payload.action}`);

      - name: Resolve policy file paths
        id: resolve
        shell: bash
        run: |
          set -euo pipefail

          # Always use central policy files — never local overrides from the PR branch.
          # A PR could include a malicious risk-rules.json to bypass deterministic checks.
          # Repo-specific policy should be configured via the central repo, not per-PR files.
          RULES_PATH=".risk-tier-policy-gate/config/risk-rules.json"
          CONDITIONS_PATH=".risk-tier-policy-gate/risk-tier-conditions.md"

          echo "rules_path=$RULES_PATH" >> "$GITHUB_OUTPUT"
          echo "conditions_path=$CONDITIONS_PATH" >> "$GITHUB_OUTPUT"

      - name: Collect changed files
        id: changed
        env:
          FULL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Use GitHub PR (merge-base) semantics and preserve filenames exactly.
          # full-changed-files.txt remains NUL-delimited for review reconciliation.
          git diff --no-renames --name-only -z "$FULL_BASE_SHA...$HEAD_SHA" > full-changed-files.txt
          git diff --no-renames --no-ext-diff "$FULL_BASE_SHA...$HEAD_SHA" > full-pr.diff

          echo "Classifying the full PR diff:"
          if [[ ! -s full-changed-files.txt ]]; then
            echo "No changed files detected — treating as low risk"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Changed file count: $(tr -cd '\000' < full-changed-files.txt | wc -c | tr -d ' ')"
          fi

      - name: PR size check (always full PR diff)
        if: steps.changed.outputs.has_changes == 'true'
        id: size
        env:
          FULL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Full PR size — always evaluated against the complete PR diff
          FULL_FILE_COUNT=$(tr -cd '\000' < full-changed-files.txt | wc -c | tr -d ' ')
          FULL_LINE_COUNT=$(git diff --no-renames --shortstat "$FULL_BASE_SHA...$HEAD_SHA" | grep -oP '\d+ insertion' | grep -oP '\d+' || echo 0)
          LARGE_PR=false
          if [[ "$FULL_FILE_COUNT" -ge 50 ]] || [[ "$FULL_LINE_COUNT" -ge 1000 ]]; then
            LARGE_PR=true
          fi
          echo "file_count=$FULL_FILE_COUNT" >> "$GITHUB_OUTPUT"
          echo "line_count=$FULL_LINE_COUNT" >> "$GITHUB_OUTPUT"
          echo "large_pr=$LARGE_PR" >> "$GITHUB_OUTPUT"
          echo "Full PR — Files: $FULL_FILE_COUNT, Lines added: $FULL_LINE_COUNT, Large: $LARGE_PR"

      - name: Deterministic full PR risk pre-check
        if: steps.changed.outputs.has_changes == 'true'
        id: rules
        env:
          RULES_PATH: ${{ steps.resolve.outputs.rules_path }}
        run: |
          set -euo pipefail
          node .risk-tier-policy-gate/scripts/risk-rules.mjs full-changed-files.txt "$RULES_PATH"

      - name: LLM classify full PR (non-forced cases)
        id: llm_classify
        if: steps.changed.outputs.has_changes == 'true' && steps.rules.outputs.forced_high != 'true' && steps.rules.outputs.all_low_safe != 'true' && steps.size.outputs.large_pr != 'true' && env.CLAUDE_CODE_OAUTH_TOKEN != ''
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --model sonnet --max-turns 15 --allowedTools Read,Glob,Grep
            --disallowedTools GitHub,Bash,Edit,Write
            --json-schema '{"type":"object","properties":{"tier":{"type":"string","enum":["high","low"]},"reasons":{"type":"array","items":{"type":"string"}}},"required":["tier","reasons"],"additionalProperties":false}'
          prompt: |
            Classify the complete current PR diff. Do not limit classification
            to the latest commit or push.

            Full PR range: `${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}`

            Deterministic pre-check result:
            - tier: `${{ steps.rules.outputs.deterministic_tier }}`
            - forced_high: `${{ steps.rules.outputs.forced_high }}`
            - all_low_safe: `${{ steps.rules.outputs.all_low_safe }}`

            Read `risk-result.json` for changed files and pre-check details.
            Read `full-pr.diff` for the exact full PR patch.
            Read `${{ steps.resolve.outputs.conditions_path }}` for risk-tier policy conditions.

            Rules:
            1) If ANY high-risk category applies, return `tier: high`.
            2) Otherwise return `tier: low`.
            3) Return 1-5 concise policy reasons in `reasons`.
            4) Do not apply or remove labels, create or dismiss reviews, or
               create or update comments. Return the structured output only.

      - name: Apply full PR classification
        id: full_tier
        uses: actions/github-script@v7
        env:
          HAS_CHANGES: ${{ steps.changed.outputs.has_changes }}
          LARGE_PR: ${{ steps.size.outputs.large_pr }}
          FILE_COUNT: ${{ steps.size.outputs.file_count }}
          LINE_COUNT: ${{ steps.size.outputs.line_count }}
          FORCED_HIGH: ${{ steps.rules.outputs.forced_high }}
          ALL_LOW_SAFE: ${{ steps.rules.outputs.all_low_safe }}
          LLM_OUTCOME: ${{ steps.llm_classify.outcome }}
          LLM_OUTPUT: ${{ steps.llm_classify.outputs.structured_output }}
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.payload.pull_request.number;
            const botLabelPrefix = 'risktier:';

            function sanitizeReason(reason) {
              return String(reason)
                .replace(/[\u0000-\u001f\u007f]/g, ' ')
                .replace(/@/g, '@\u200b')
                .slice(0, 500)
                .trim();
            }

            const hasChanges = process.env.HAS_CHANGES === 'true';
            const largePr = process.env.LARGE_PR === 'true';
            const forcedHigh = process.env.FORCED_HIGH === 'true';
            let tier;
            let reasons = [];
            let fallback = false;

            if (!hasChanges) {
              tier = 'low';
              reasons = ['The full PR has no changed files.'];
            } else if (largePr || forcedHigh) {
              tier = 'high';
              if (largePr) {
                reasons.push(`The full PR exceeds the size gate (${process.env.FILE_COUNT} files, ${process.env.LINE_COUNT} lines added).`);
              }
              if (forcedHigh) {
                const result = JSON.parse(fs.readFileSync('risk-result.json', 'utf8'));
                const categories = Array.isArray(result.matched_categories)
                  ? result.matched_categories.slice(0, 10)
                  : [];
                if (categories.length > 0) {
                  reasons.push(`Deterministic high-risk categories: ${categories.join(', ').replace(/_/g, ' ')}.`);
                }
              }
            } else if (process.env.ALL_LOW_SAFE === 'true') {
              tier = 'low';
              reasons = ['Every changed file matches a deterministic low-risk pattern.'];
            } else {
              tier = 'high';
              reasons = ['LLM classification was unavailable, failed, or returned an invalid result.'];
              fallback = true;
              if (process.env.LLM_OUTCOME === 'success' && process.env.LLM_OUTPUT) {
                try {
                  const parsed = JSON.parse(process.env.LLM_OUTPUT);
                  const parsedReasons = Array.isArray(parsed.reasons)
                    ? parsed.reasons.slice(0, 5).filter(reason => typeof reason === 'string').map(sanitizeReason).filter(Boolean)
                    : [];
                  if ((parsed.tier === 'high' || parsed.tier === 'low') && parsedReasons.length > 0) {
                    tier = parsed.tier;
                    reasons = parsedReasons;
                    fallback = false;
                  }
                } catch (err) {
                  core.warning(`Could not parse full PR LLM result: ${err.message}`);
                }
              }
            }

            const targetLabel = `risktier:${tier}`;
            const labels = await github.paginate(github.rest.issues.listLabelsOnIssue, { owner, repo, issue_number, per_page: 100 });
            for (const l of labels) {
              if (l.name.startsWith(botLabelPrefix) && l.name !== targetLabel) {
                try {
                  await github.rest.issues.removeLabel({ owner, repo, issue_number, name: l.name });
                } catch (err) {
                  if (err.status !== 404) throw err;
                  core.info(`Label ${l.name} was already removed`);
                }
              }
            }
            await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [targetLabel] });

            const marker = '<!-- risktier-bot-comment -->';
            const reasonLines = reasons.map(sanitizeReason).filter(Boolean).map(reason => `- ${reason}`);
            const body = [
              marker,
              `🏰 **PhishFort Risk Tier Profiler** — Risk tier: **${tier.toUpperCase()}**${fallback ? ' (fallback)' : ''}`,
              '',
              fallback
                ? 'Defaulting to high risk as a precaution. Human review is required before merging.'
                : tier === 'high'
                ? 'Human review is required before merging.'
                : 'No high-risk policy category applies. No human review is required.',
              '',
              '**Reasons:**',
              ...reasonLines,
              '',
              '**Resources:**',
              '- [Risk tier policy conditions](https://github.com/phishfort/risk-tier-policy-gate/blob/main/risk-tier-conditions.md)',
              '- [Deterministic rule definitions](https://github.com/phishfort/risk-tier-policy-gate/blob/main/config/risk-rules.json)'
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const existing = comments.find(c => c.body?.includes(marker) && c.user?.login === 'github-actions[bot]');
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

            const appliedLabels = await github.paginate(github.rest.issues.listLabelsOnIssue, {
              owner, repo, issue_number, per_page: 100
            });
            const tierLabels = appliedLabels.filter(l => l.name === 'risktier:high' || l.name === 'risktier:low');
            if (tierLabels.length !== 1) {
              throw new Error(`Full PR classification produced ${tierLabels.length} risk-tier labels; expected exactly one`);
            }
            if (tierLabels[0].name !== targetLabel) {
              throw new Error(`Expected ${targetLabel}, found ${tierLabels[0].name}`);
            }
            core.setOutput('tier', tier);
            core.info(`Full PR risk tier: ${tier.toUpperCase()}`);

      - name: Reconcile full tier and manage approvals
        uses: actions/github-script@v7
        env:
          PREVIOUS_LABEL: ${{ steps.prev.outputs.label }}
          FULL_TIER: ${{ steps.full_tier.outputs.tier }}
          RULES_PATH: ${{ steps.resolve.outputs.rules_path }}
        with:
          script: |
            const { execFileSync } = require('child_process');
            const fs = require('fs');
            const path = require('path');
            const { pathToFileURL } = require('url');
            const transitionModule = pathToFileURL(
              path.resolve('.risk-tier-policy-gate/scripts/risk-transition.mjs')
            ).href;
            const {
              approvalAction,
              effectiveApprovals,
              isApprovalDeltaLowRisk,
              parseFilteredNumstat,
              pathSetFromNul,
              shouldDismissApproval,
            } = await import(transitionModule);

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr_number = context.payload.pull_request.number;
            const previousTier = (process.env.PREVIOUS_LABEL || '').replace('risktier:', '');
            const fullTier = process.env.FULL_TIER;
            const headSha = context.payload.pull_request.head.sha;

            const action = approvalAction({ previousTier, fullTier });
            core.info(`Approval action: ${action}; full tier: ${fullTier}`);

            if (action === 'ensure-low-approval') {
              const reviews = await github.paginate(github.rest.pulls.listReviews, {
                owner, repo, pull_number: pr_number, per_page: 100
              });
              const hasBotApproval = effectiveApprovals(reviews).some(review =>
                review.user?.login === 'github-actions[bot]'
              );
              if (!hasBotApproval) {
                await github.rest.pulls.createReview({
                  owner, repo, pull_number: pr_number,
                  event: 'APPROVE',
                  body: previousTier === 'high'
                    ? '🏰 **PhishFort Risk Tier Profiler** — Auto-approved (the full PR was reclassified as low risk).'
                    : '🏰 **PhishFort Risk Tier Profiler** — Auto-approved (low risk).'
                });
                core.info('Bot auto-approved — full PR is low risk');
              } else {
                core.info('Full PR is low-risk — existing bot approval persists');
              }
              return;
            }

            // Full PR is HIGH. Reconcile every active approval against current
            // HEAD so canceled/coalesced synchronize runs cannot hide an older
            // risky push. The bot never satisfies a HIGH gate. A stale human
            // approval is preserved only when its complete net delta is proven
            // deterministic-low (docs/tests/styles/assets and below size gates).
            const rules = JSON.parse(fs.readFileSync(process.env.RULES_PATH, 'utf8'));
            const fullFileSet = pathSetFromNul(fs.readFileSync('full-changed-files.txt'));
            const deltaCache = new Map();

            function approvalDeltaIsLowRisk(reviewCommitId) {
              if (deltaCache.has(reviewCommitId)) return deltaCache.get(reviewCommitId);
              if (!/^[0-9a-f]{40}$/i.test(reviewCommitId || '')) {
                deltaCache.set(reviewCommitId, false);
                return false;
              }

              try {
                // Parse --numstat as raw NUL-delimited bytes. Filtering and the
                // insertion count therefore use the exact same set of files,
                // excluding merge-in churn that is absent from the current PR.
                const numstat = execFileSync(
                  'git', ['diff', '--no-renames', '--numstat', '-z', reviewCommitId, headSha],
                  { encoding: null, maxBuffer: 20 * 1024 * 1024 }
                );
                const { files, insertions } = parseFilteredNumstat(numstat, fullFileSet);
                const decoder = new TextDecoder('utf-8', { fatal: true });
                const fileNames = files.map(file => decoder.decode(file));
                const lowRisk = isApprovalDeltaLowRisk({ files: fileNames, insertions, rules });
                deltaCache.set(reviewCommitId, lowRisk);
                return lowRisk;
              } catch (err) {
                core.warning(`Could not assess approval delta from ${String(reviewCommitId).slice(0, 7)}: ${err.message}`);
                deltaCache.set(reviewCommitId, false);
                return false;
              }
            }

            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner, repo, pull_number: pr_number, per_page: 100
            });
            const approved = effectiveApprovals(reviews);
            const toDismiss = approved.filter(review => {
              const login = review.user?.login;
              const deltaLowRisk = login === 'github-actions[bot]' || review.commit_id === headSha
                ? false
                : approvalDeltaIsLowRisk(review.commit_id);
              return shouldDismissApproval({
                reviewerLogin: login,
                reviewCommitId: review.commit_id,
                headSha,
                deltaLowRisk,
              });
            });

            const dismissalErrors = [];
            for (const review of toDismiss) {
              const login = review.user?.login;
              const who = login === 'github-actions[bot]' ? 'bot' : login || 'deleted account';
              core.info(`Dismissing ${who}'s approval at ${String(review.commit_id).slice(0, 7)} for current HIGH tier`);
              try {
                await github.rest.pulls.dismissReview({
                  owner, repo, pull_number: pr_number,
                  review_id: review.id,
                  message: '🏰 **PhishFort Risk Tier Profiler** — Dismissing approval. The full PR is high-risk and this approval does not cover the current risky changes.'
                });
              } catch (err) {
                if (err.status === 404 || err.status === 422) {
                  core.warning(`Could not dismiss ${who} review ${review.id} (${err.status}); verifying effective approvals again`);
                } else {
                  dismissalErrors.push(`${who} review ${review.id}: ${err.status || 'error'} ${err.message}`);
                }
              }
            }

            if (dismissalErrors.length > 0) {
              throw new Error(`Failed to dismiss required approvals: ${dismissalErrors.join('; ')}`);
            }

            // Always re-fetch before success. This catches both failed targeted
            // dismissals and a bot approval created concurrently after the
            // initial review enumeration.
            const refreshed = await github.paginate(github.rest.pulls.listReviews, {
              owner, repo, pull_number: pr_number, per_page: 100
            });
            const activeApprovals = effectiveApprovals(refreshed);
            const activeIds = new Set(activeApprovals.map(review => review.id));
            const survivors = toDismiss.filter(review => activeIds.has(review.id));
            if (survivors.length > 0) {
              throw new Error(`Required approvals remain active after dismissal: ${survivors.map(review => review.id).join(', ')}`);
            }
            const activeBotApprovals = activeApprovals.filter(
              review => review.user?.login === 'github-actions[bot]'
            );
            if (activeBotApprovals.length > 0) {
              throw new Error(`Bot approval cannot satisfy a HIGH gate: ${activeBotApprovals.map(review => review.id).join(', ')}`);
            }
            const unsafeStaleHumans = activeApprovals.filter(review => {
              const login = review.user?.login;
              return login !== 'github-actions[bot]' &&
                review.commit_id !== headSha &&
                !approvalDeltaIsLowRisk(review.commit_id);
            });
            if (unsafeStaleHumans.length > 0) {
              throw new Error(`Unsafe stale human approvals remain active: ${unsafeStaleHumans.map(review => review.id).join(', ')}`);
            }

            const prAuthor = context.payload.pull_request.user?.login;
            try {
              const collaborators = await github.paginate(github.rest.repos.listCollaborators, {
                owner, repo, permission: 'push', per_page: 100
              });
              const reviewers = collaborators
                .filter(u => u.login !== prAuthor && u.type === 'User')
                .map(u => u.login);
              if (reviewers.length > 0) {
                await github.rest.pulls.requestReviewers({
                  owner, repo, pull_number: pr_number,
                  reviewers
                });
                core.info(`Requested review from: ${reviewers.join(', ')}`);
              } else {
                core.warning('No eligible reviewers found');
              }
            } catch (err) {
              core.warning(`Failed to request reviewers (${err.status}): ${err.message}`);
            }

            core.info('High-risk PR — human review required');
